<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line Reader</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0c1635;
      --card: rgba(18, 30, 59, 0.92);
      --border: rgba(122, 196, 255, 0.22);
      --text: #f2f5fc;
      --muted: #b9c6df;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f6fb;
        --card: #ffffff;
        --border: #d9e2f0;
        --text: #1b2434;
        --muted: #54627a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.24);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 800;
    }
    p {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Line Reader</h1>
    <p>İngilizce okuma ve anlık çeviri uygulaması.</p>
  </div>
</body>
</html>
