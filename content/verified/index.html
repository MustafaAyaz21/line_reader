<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line Reader — E-posta Doğrulandı</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0c1635;
      --card: rgba(18, 30, 59, 0.92);
      --border: rgba(122, 196, 255, 0.25);
      --text: #f2f5fc;
      --muted: #b9c6df;
      --accent: #38bdf8;
      --ok: #22c55e;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f6fb;
        --card: #ffffff;
        --border: #d9e2f0;
        --text: #1b2434;
        --muted: #54627a;
        --accent: #2563eb;
        --ok: #16a34a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }
    .check-circle {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      border: 2px solid var(--ok);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--ok);
    }
    h1 { margin: 0 0 10px; font-size: 22px; font-weight: 800; }
    p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--muted); }
    .spinner {
      width: 24px;
      height: 24px;
      margin: 22px auto 0;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fallback-wrap {
      display: none;
      margin-top: 22px;
      animation: fadeIn 0.3s ease-out forwards;
    }
    .fallback-wrap.visible { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      background: var(--accent);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-circle">✓</div>
    <h1>E-postanız doğrulandı!</h1>
    <p id="statusText">Line Reader uygulamasına yönlendiriliyorsunuz...</p>
    <div class="spinner" id="spinner"></div>
    <div class="fallback-wrap" id="fallbackWrap">
      <a class="btn" id="openAppBtn" href="linereader://email-verified">Line Reader'a Dön</a>
    </div>
  </div>
  <script>
    (function () {
      var deepLink = "linereader://email-verified";
      var androidIntent = "intent://email-verified#Intent;scheme=linereader;package=com.lineapps.linereader;end";
      var isAndroid = /android/i.test(navigator.userAgent || "");

      function tryOpenApp() {
        try {
          window.location.href = isAndroid ? androidIntent : deepLink;
        } catch (_) {
          window.location.href = deepLink;
        }
      }

      setTimeout(tryOpenApp, 250);

      setTimeout(function () {
        var spinner = document.getElementById("spinner");
        var wrap = document.getElementById("fallbackWrap");
        var statusText = document.getElementById("statusText");
        if (spinner) spinner.style.display = "none";
        if (statusText) {
          statusText.textContent = "Otomatik geçiş engellendiyse aşağıdaki butonla uygulamaya dönebilirsiniz.";
        }
        if (wrap) wrap.classList.add("visible");
      }, 5000);
    })();
  </script>
</body>
</html>
