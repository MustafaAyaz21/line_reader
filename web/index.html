  <meta charset="UTF-8">

    Without it, the browser keeps the app clear of them, and `SafeArea` and

  <title>Line Reader — Makale &amp; Akıllı Kelime Öğrenme</title>
  <link rel="manifest" href="manifest.json?v=3">
  <style>
    #lr-offline-overlay {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at 50% 28%, rgba(59, 130, 246, 0.20), #0b101b 72%);
      color: #f8fafc;
      opacity: 0;
      transition: opacity 0.28s ease;
    }
    #lr-offline-overlay.lr-visible {
      display: flex;
      opacity: 1;
    }
    @keyframes lrFloatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes lrPulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    .lr-offline-art {
      animation: lrFloatSlow 3.2s ease-in-out infinite;
      margin-bottom: 22px;
    }
    .lr-offline-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .lr-offline-desc {
      margin: 10px 0 0;
      max-width: 420px;
      font-size: 14.5px;
      line-height: 1.6;
      color: #94a3b8;
    }
    .lr-offline-actions {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .lr-offline-btn {
      border: none;
      cursor: pointer;
      padding: 11px 22px;
      border-radius: 12px;
      background: #3b82f6;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.32);
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .lr-offline-btn:hover { background: #60a5fa; }
    .lr-offline-btn:active { transform: scale(0.97); }
    .lr-offline-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fcd34d;
    }
    .lr-offline-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #fbbf24;
      animation: lrPulseDot 1.6s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Çevrimdışı (Offline) Editorial Kitap & Işık Ekranı -->
  <div id="lr-offline-overlay" role="alert" aria-live="assertive">
    <div class="lr-offline-art">
      <svg width="136" height="104" viewBox="0 0 110 84" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="55" cy="70" rx="38" ry="6" fill="#3b82f6" fill-opacity="0.22"/>
        <path d="M16 28 C28 24, 44 25, 55 33 C66 25, 82 24, 94 28 L94 64 C82 60, 66 61, 55 69 C44 61, 28 60, 16 64 Z" fill="#162033" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round"/>
        <path d="M55 33 L55 69" stroke="#60a5fa" stroke-width="1.8"/>
        <line x1="25" y1="38" x2="45" y2="41" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <line x1="25" y1="46" x2="45" y2="49" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.48"/>
        <line x1="65" y1="41" x2="85" y2="38" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <line x1="65" y1="49" x2="82" y2="46" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" opacity="0.48"/>
        <circle cx="55" cy="17" r="13" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/>
        <path d="M49 16 C52 13, 58 13, 61 16" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M51.8 19 C53.5 17.5, 56.5 17.5, 58.2 19" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="55" cy="22" r="1.4" fill="#fbbf24"/>
        <line x1="48" y1="23" x2="62" y2="11" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1 class="lr-offline-title">Bağlantı Kısa Bir Mola Verdi</h1>
    <p class="lr-offline-desc">
      İnternet bağlantın kesildi. Bağlantın geri geldiğinde kaldığın satırdan otomatik olarak devam edeceğiz.
    </p>
    <div class="lr-offline-actions">
      <button type="button" id="lr-offline-retry" class="lr-offline-btn">Tekrar Dene</button>
      <span class="lr-offline-status">
        <span class="lr-offline-dot"></span>
        Bağlantı bekleniyor...
      </span>
    </div>
  </div>
  <script>
    (function () {
      var overlay = document.getElementById('lr-offline-overlay');
      var retryBtn = document.getElementById('lr-offline-retry');
      if (!overlay) return;

      function showOffline() {
        overlay.classList.add('lr-visible');
      }
      function hideOffline() {
        overlay.classList.remove('lr-visible');
      }
      function syncState() {
        if (navigator.onLine === false) {
          showOffline();
        } else {
          hideOffline();
        }
      }

      window.addEventListener('offline', showOffline);
      window.addEventListener('online', hideOffline);
      if (retryBtn) {
        retryBtn.addEventListener('click', function () {
          if (navigator.onLine) {
            hideOffline();
            if (!document.querySelector('flt-glass-pane')) {
              window.location.reload();
            }
          } else {
            retryBtn.textContent = 'Hâlâ Çevrimdışı';
            setTimeout(function () { retryBtn.textContent = 'Tekrar Dene'; }, 1400);
          }
        });
      }
      syncState();
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
