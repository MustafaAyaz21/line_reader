name: linereader
description: Kullanıcı dostu ve sade bir kelime öğrenme ve okuma uygulaması.
publish_to: 'none'
version: 0.1.16+17

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.5.0
  firebase_core: ^3.12.0
  flutter_tts: ^4.2.2
  google_sign_in: ^6.2.2
  http: ^1.2.2
  package_info_plus: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
